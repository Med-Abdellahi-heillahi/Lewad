name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable verification builds must not depend on a developer's
    # .env.local or on repository secrets. These fake public test placeholders
    # only satisfy Vite's startup validation; CI never deploys
    # this build or calls the placeholder project.
    env:
      VITE_SUPABASE_URL: "https://example.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_test_key_for_ci_only"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused tests
        run: npm test

      - name: Type-check application
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build application
        run: npm run build
