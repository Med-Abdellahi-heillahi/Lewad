map $uri $lewad_cache_control {
  default "no-cache";
  ~^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:css|js|mjs|woff|woff2|ttf|eot|svg|png|jpe?g|webp|avif|ico)$ "public, max-age=31536000, immutable";
  ~^/(?:assets|icons)/ "public, max-age=86400, stale-while-revalidate=604800";
  =/manifest.webmanifest "no-cache, must-revalidate";
  =/sw.js "no-cache, no-store, must-revalidate";
  =/index.html "no-cache, no-store, must-revalidate";
}

map $uri $lewad_service_worker_scope {
  default "";
  =/sw.js "/";
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header Cache-Control $lewad_cache_control;
  add_header Service-Worker-Allowed $lewad_service_worker_scope always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location = /sw.js {
    try_files $uri =404;
  }

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location ^~ /icons/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
